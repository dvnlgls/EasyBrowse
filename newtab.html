<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>New Tab</title>
  <style>
    :root { color-scheme: dark; }
    body {
      font-family: sans-serif; margin: 0; padding: 16px; box-sizing: border-box;
      min-height: 100vh; background: #1c1e24; color: #e4e6eb;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
    }
    main { width: 100%; max-width: 480px; display: flex; flex-direction: column; align-items: center; }
    #q {
      width: 100%; box-sizing: border-box; padding: 14px 16px; font-size: 16px; text-align: center;
      background: #2a2d35; color: inherit; border: 1px solid #3a3e48; border-radius: 12px; outline: none;
    }
    #q:focus { border-color: #6b8afd; }
    #q::placeholder { color: #8b909c; }
    .grid { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin-top: 28px; width: 100%; }
    .tile { position: relative; flex: 0 0 96px; }
    .tile a, .tile .label {
      display: block; padding: 14px 8px; text-align: center; text-decoration: none;
      background: #2a2d35; border: 1px solid #3a3e48; border-radius: 12px; color: inherit; word-break: break-word;
    }
    .tile .remove {
      position: absolute; top: -8px; right: -8px; width: 26px; height: 26px;
      border-radius: 50%; border: none; background: #c33; color: #fff; font-size: 16px; line-height: 1;
    }
    .bar { margin-top: 28px; display: flex; gap: 8px; align-items: center; justify-content: center; }
    .bar button, #add-form button {
      padding: 8px 14px; font-size: 14px; background: #2a2d35; color: inherit;
      border: 1px solid #3a3e48; border-radius: 8px;
    }
    #add-form { display: none; margin-top: 12px; gap: 8px; flex-wrap: wrap; justify-content: center; width: 100%; }
    #add-form.show { display: flex; }
    #add-form input {
      flex: 1 1 140px; padding: 10px; font-size: 16px; box-sizing: border-box;
      background: #2a2d35; color: inherit; border: 1px solid #3a3e48; border-radius: 8px;
    }
    #msg { margin-top: 8px; font-size: 13px; color: #ff7b7b; min-height: 1em; text-align: center; }
  </style>
</head>
<body>
  <main>
  <input id="q" type="text" placeholder="Search Google or enter address" autofocus>

  <div id="grid" class="grid"></div>

  <div class="bar">
    <button id="edit-toggle" type="button">Edit</button>
    <button id="reset" type="button" hidden>Reset to defaults</button>
  </div>

  <form id="add-form">
    <input id="add-name" type="text" placeholder="Name" required>
    <input id="add-url" type="text" placeholder="example.com" required>
    <button type="submit">Add</button>
  </form>
  <div id="msg"></div>
  </main>

  <script src="newtab.js"></script>
  <script src="content.js"></script>
</body>
</html>
